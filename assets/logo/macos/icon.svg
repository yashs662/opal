<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Opal">
  <!--
    macOS app icon. Apple's icon grid: an 824x824 rounded rectangle (corner
    radius 185.4) centred on a 1024 canvas, leaving a 100px transparent
    gutter for the shadow. macOS 26 shrinks any icon that doesn't fill this
    shape onto a grey plate, so the bare dragonfly mark (../icon.svg) can't
    be used as-is. The PNGs beside this file are renders of it.
  -->
  <defs>
    <linearGradient id="opal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"    stop-color="#9CF6D8"/>
      <stop offset="0.22" stop-color="#8FD3FF"/>
      <stop offset="0.45" stop-color="#C9B3FF"/>
      <stop offset="0.68" stop-color="#FF9ECF"/>
      <stop offset="0.85" stop-color="#FFC59E"/>
      <stop offset="1"    stop-color="#FFE3A8"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A2644"/>
      <stop offset="1" stop-color="#0F0D1A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#A78BFF" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#A78BFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12"/>
      <feOffset dy="12"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185.4" filter="url(#shadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="185.4" fill="url(#plate)"/>
  <rect x="100" y="100" width="824" height="824" rx="185.4" fill="url(#glow)"/>
  <rect x="102" y="102" width="820" height="820" rx="183.4" fill="none" stroke="url(#rim)" stroke-width="4"/>
  <!-- The dragonfly mark, scaled about its own centre onto the plate's. -->
  <g fill="url(#opal)" transform="translate(512 512) scale(3.5) translate(-100 -95.5)">
    <circle cx="100" cy="34" r="9"/>
    <path d="M96,73 L104,73 L101,166 L99,166 Z"/>
    <path d="M100,73 C134,54 170,48 186,50 C170,61 134,72 100,73 Z"/>
    <path d="M100,73 C66,54 30,48 14,50 C30,61 66,72 100,73 Z"/>
    <path d="M100,73 C132,78 166,90 186,98 C170,86 134,73 100,73 Z"/>
    <path d="M100,73 C68,78 34,90 14,98 C30,86 66,73 100,73 Z"/>
    <circle cx="100" cy="73" r="4.5"/>
  </g>
</svg>
